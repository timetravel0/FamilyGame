<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Famiglia in Avventura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2a2140;
        --cream: #fff4d6;
        --gold: #ffd23f;
        --rose: #ff5b78;
        --panel: #241a3a;
        --panel-2: #2f234d;
        --line: #4a3a78;
        --accent: #ffb43d;
        --good: #67d96b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: radial-gradient(1200px 600px at 50% -10%, #2a2150 0%, #160f2c 55%, #0e0a1f 100%);
        font-family: "Baloo 2", system-ui, sans-serif;
        color: var(--cream);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 14px 12px 10px;
        gap: 12px;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: .06;
        z-index: 0;
        background-image: radial-gradient(circle, #fff 1px, transparent 1.4px);
        background-size: 26px 26px;
      }
      .wrap {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: min(480px, calc((100vh - 110px) * 1080 / 1440));
      }
      .titlebar {
        display: flex;
        align-items: baseline;
        gap: 10px;
        justify-content: center;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .titlebar h1 {
        font-family: "Press Start 2P", monospace;
        font-size: 12px;
        margin: 0;
        letter-spacing: 1px;
        color: var(--gold);
        text-shadow: 0 2px 0 #b97600, 0 4px 0 rgba(0,0,0,.4);
      }
      #frame {
        position: relative;
        width: 100%;
        border-radius: 18px;
        overflow: hidden;
        background: #0b0a18;
        border: 4px solid #120e26;
        box-shadow:
          0 0 0 4px #2c2350,
          0 18px 40px rgba(0,0,0,.55),
          inset 0 0 0 2px rgba(255,255,255,.04);
        aspect-ratio: 1080 / 1440;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #scanlines {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        border-radius: 14px;
        background: repeating-linear-gradient(to bottom, rgba(0,0,0,.08) 0 2px, rgba(0,0,0,0) 2px 4px);
        mix-blend-mode: multiply;
        opacity: .45;
      }
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        border-radius: 14px;
        box-shadow: inset 0 0 80px rgba(0,0,0,.4);
      }
      .editor-link {
        position: absolute;
        top: 10px;
        right: 12px;
        z-index: 7;
        font-family: "Press Start 2P", monospace;
        font-size: 8px;
        color: var(--cream);
        padding: 8px 10px;
        border-radius: 10px;
        background: linear-gradient(#3a2c63, #271c45);
        border: 2px solid #51407f;
        box-shadow: 0 3px 0 #181030;
        text-decoration: none;
        letter-spacing: 1px;
        user-select: none;
        transition: transform .06s, box-shadow .06s;
      }
      .editor-link:active {
        transform: translateY(3px);
        box-shadow: 0 0 0 #181030;
      }
      /* ── Touch Controls ─────────────────────────────────── */
      #tc-move, #tc-actions {
        display: none;
        position: fixed;
        bottom: 14px;
        z-index: 20;
        touch-action: none;
        user-select: none;
      }
      #tc-move { left: 10px; width: 148px; }
      #tc-actions {
        right: 10px;
        width: 156px;
        flex-direction: column;
        gap: 7px;
      }
      @media (pointer: coarse) {
        #tc-move    { display: block; }
        #tc-actions { display: flex; }
      }
      /* D-Pad zone */
      #tc-lr {
        width: 148px;
        height: 76px;
        border-radius: 18px;
        background: rgba(36, 26, 58, 0.9);
        border: 2px solid var(--line);
        display: grid;
        grid-template-columns: 1fr 1fr;
        overflow: hidden;
        box-shadow: 0 5px 0 #110a22;
      }
      .tc-arrow {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Press Start 2P", monospace;
        font-size: 26px;
        color: var(--cream);
        opacity: 0.45;
        transition: opacity .06s, background .06s;
      }
      .tc-arrow.active {
        opacity: 1;
        background: rgba(255, 255, 255, 0.13);
      }
      .tc-left-arrow { border-right: 1px solid var(--line); }
      /* Action buttons */
      .tc-row { display: flex; gap: 7px; }
      .tc-btn {
        border: 2px solid #51407f;
        border-radius: 14px;
        background: linear-gradient(#3a2c63, #271c45);
        color: var(--cream);
        font: 700 13px/1 "Press Start 2P", monospace;
        box-shadow: 0 4px 0 #181030;
        touch-action: none;
        user-select: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      .tc-btn:active, .tc-btn.active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #181030;
      }
      .tc-jump {
        width: 100%;
        height: 56px;
        background: linear-gradient(#ffd54a, #ffb028);
        border-color: #ffd54a;
        color: #3a2300;
        box-shadow: 0 4px 0 #b56b00;
        font-size: 11px;
        letter-spacing: 1px;
      }
      .tc-jump:active { box-shadow: 0 1px 0 #b56b00; }
      .tc-ability {
        flex: 1;
        height: 54px;
        background: linear-gradient(#b78bff, #7d4ad0);
        border-color: #b78bff;
        color: #1b0d33;
        box-shadow: 0 4px 0 #4a2880;
        font-size: 20px;
      }
      .tc-ability:active { box-shadow: 0 1px 0 #4a2880; }
      .tc-run {
        flex: 1;
        height: 54px;
        background: linear-gradient(#8fd0ff, #4aa3e8);
        color: #08263f;
        box-shadow: 0 4px 0 #2f6ea8;
        font-size: 16px;
      }
      .tc-run:active { box-shadow: 0 1px 0 #2f6ea8; }
      .tc-switch, .tc-pause, .tc-restart {
        flex: 1;
        height: 42px;
      }
      .tc-switch { font-size: 18px; }
      .tc-pause  { font-size: 14px; }
      .tc-restart {
        font-size: 18px;
        background: linear-gradient(#ff5b78, #c0274a);
        border-color: #ff5b78;
        color: #fff4d6;
        box-shadow: 0 4px 0 #7a0f2a;
      }
      .tc-restart:active { box-shadow: 0 1px 0 #7a0f2a; }
      @media (max-height: 560px) {
        .titlebar { display: none; }
        body { padding: 6px; gap: 6px; }
        .wrap { max-width: min(100vw, calc(100vh * 1080 / 1440)); }
      }
      @media (pointer: coarse) and (max-height: 560px) {
        #tc-move, #tc-actions { bottom: 6px; }
        #tc-lr { height: 62px; }
        .tc-jump { height: 46px; }
        .tc-ability, .tc-run { height: 44px; }
        .tc-switch, .tc-pause, .tc-restart { height: 36px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="titlebar">
        <h1>Famiglia in Avventura</h1>
      </div>
      <div id="frame">
        <canvas id="game" width="1080" height="1440" aria-label="Family side-scroller game"></canvas>
        <div id="scanlines"></div>
        <div id="vignette"></div>
        <a class="editor-link" href="./terrain-editor.html">Editor</a>
      </div>
    </div>
    <!-- D-Pad sinistra: zone con slide sinistra/destra -->
    <div id="tc-move" aria-label="Movimento">
      <div id="tc-lr">
        <div class="tc-arrow tc-left-arrow"  aria-label="Sinistra">◀</div>
        <div class="tc-arrow tc-right-arrow" aria-label="Destra">▶</div>
      </div>
    </div>
    <!-- Pulsanti azione destra -->
    <div id="tc-actions" aria-label="Azioni">
      <button class="tc-btn tc-jump"    type="button" data-control="jump"    aria-label="Salta">▲ SALTA</button>
      <div class="tc-row">
        <button class="tc-btn tc-ability" type="button" data-control="ability" aria-label="Abilità">★</button>
        <button class="tc-btn tc-run"     type="button" data-control="run"     aria-label="Corri">⚡</button>
      </div>
      <div class="tc-row">
        <button class="tc-btn tc-switch"  type="button" id="switch-btn"  aria-label="Cambia personaggio">⇄</button>
        <button class="tc-btn tc-pause"   type="button" id="pause-btn"   aria-label="Pausa">⏸</button>
        <button class="tc-btn tc-restart" type="button" id="restart-btn" aria-label="Ricomincia" style="display:none">↺</button>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
