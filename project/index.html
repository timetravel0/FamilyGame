<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Famiglia in Avventura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2a2140;
        --cream: #fff4d6;
        --gold: #ffd23f;
        --rose: #ff5b78;
        --panel: #241a3a;
        --panel-2: #2f234d;
        --line: #4a3a78;
        --accent: #ffb43d;
        --good: #67d96b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: radial-gradient(1200px 600px at 50% -10%, #2a2150 0%, #160f2c 55%, #0e0a1f 100%);
        font-family: "Baloo 2", system-ui, sans-serif;
        color: var(--cream);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 14px 12px 10px;
        gap: 12px;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: .06;
        z-index: 0;
        background-image: radial-gradient(circle, #fff 1px, transparent 1.4px);
        background-size: 26px 26px;
      }
      .wrap {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: min(480px, calc((100vh - 110px) * 1080 / 1440));
      }
      .titlebar {
        display: flex;
        align-items: baseline;
        gap: 10px;
        justify-content: center;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .titlebar h1 {
        font-family: "Press Start 2P", monospace;
        font-size: 12px;
        margin: 0;
        letter-spacing: 1px;
        color: var(--gold);
        text-shadow: 0 2px 0 #b97600, 0 4px 0 rgba(0,0,0,.4);
      }
      #frame {
        position: relative;
        width: 100%;
        border-radius: 18px;
        overflow: hidden;
        background: #0b0a18;
        border: 4px solid #120e26;
        box-shadow:
          0 0 0 4px #2c2350,
          0 18px 40px rgba(0,0,0,.55),
          inset 0 0 0 2px rgba(255,255,255,.04);
        aspect-ratio: 1080 / 1440;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #scanlines {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        border-radius: 14px;
        background: repeating-linear-gradient(to bottom, rgba(0,0,0,.08) 0 2px, rgba(0,0,0,0) 2px 4px);
        mix-blend-mode: multiply;
        opacity: .45;
      }
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        border-radius: 14px;
        box-shadow: inset 0 0 80px rgba(0,0,0,.4);
      }
      .editor-link {
        position: absolute;
        top: 10px;
        right: 12px;
        z-index: 7;
        font-family: "Press Start 2P", monospace;
        font-size: 8px;
        color: var(--cream);
        padding: 8px 10px;
        border-radius: 10px;
        background: linear-gradient(#3a2c63, #271c45);
        border: 2px solid #51407f;
        box-shadow: 0 3px 0 #181030;
        text-decoration: none;
        letter-spacing: 1px;
        user-select: none;
        transition: transform .06s, box-shadow .06s;
      }
      .editor-link:active {
        transform: translateY(3px);
        box-shadow: 0 0 0 #181030;
      }
      #touch-controls {
        display: none;
        position: fixed;
        left: 12px;
        bottom: 12px;
        grid-template-columns: repeat(3, 72px) 56px 56px;
        grid-template-rows: 74px;
        gap: 8px;
        padding: 10px;
        border: 2px solid var(--line);
        border-radius: 16px;
        background: rgba(36, 26, 58, 0.85);
        backdrop-filter: blur(6px);
        touch-action: none;
        user-select: none;
        z-index: 20;
      }
      @media (pointer: coarse) {
        #touch-controls { display: grid; }
      }
      #touch-controls button {
        border: 2px solid #51407f;
        border-radius: 16px;
        background: linear-gradient(#3a2c63, #271c45);
        color: var(--cream);
        font: 700 20px/1 "Press Start 2P", monospace;
        box-shadow: 0 5px 0 #181030;
        touch-action: none;
        user-select: none;
        cursor: pointer;
        display: grid;
        place-items: center;
      }
      #touch-controls button:active,
      #touch-controls button.active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 #181030;
      }
      #touch-controls .left  { grid-column: 1; }
      #touch-controls .right { grid-column: 2; }
      #touch-controls .jump {
        grid-column: 3;
        background: linear-gradient(#ffd54a, #ffb028);
        color: #3a2300;
        box-shadow: 0 5px 0 #b56b00;
        font-size: 13px;
        letter-spacing: 1px;
      }
      #touch-controls .jump:active { box-shadow: 0 1px 0 #b56b00; }
      #touch-controls .run {
        grid-column: 4;
        background: linear-gradient(#8fd0ff, #4aa3e8);
        color: #08263f;
        box-shadow: 0 5px 0 #2f6ea8;
        font-size: 18px;
      }
      #touch-controls .run:active { box-shadow: 0 1px 0 #2f6ea8; }
      #touch-controls .pause-btn {
        grid-column: 5;
        font-size: 14px;
      }
      #touch-controls .restart-btn {
        grid-column: 5;
        font-size: 18px;
        background: linear-gradient(#ff5b78, #c0274a);
        color: #fff4d6;
        box-shadow: 0 5px 0 #7a0f2a;
        border-color: #ff5b78;
      }
      #touch-controls .restart-btn:active { box-shadow: 0 1px 0 #7a0f2a; }
      @media (max-height: 560px) {
        .titlebar { display: none; }
        body { padding: 6px; gap: 6px; }
        .wrap { max-width: min(100vw, calc(100vh * 1080 / 1440)); }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="titlebar">
        <h1>Famiglia in Avventura</h1>
      </div>
      <div id="frame">
        <canvas id="game" width="1080" height="1440" aria-label="Family side-scroller game"></canvas>
        <div id="scanlines"></div>
        <div id="vignette"></div>
        <a class="editor-link" href="./terrain-editor.html">Editor</a>
      </div>
    </div>
    <div id="touch-controls" aria-label="Touch controls">
      <button class="left" type="button" data-control="left" aria-label="Muovi a sinistra">◀</button>
      <button class="right" type="button" data-control="right" aria-label="Muovi a destra">▶</button>
      <button class="jump" type="button" data-control="jump" aria-label="Salta">▲ SALTA</button>
      <button class="run" type="button" data-control="run" aria-label="Corri">⚡</button>
      <button class="pause-btn" type="button" id="pause-btn" aria-label="Pausa">⏸</button>
      <button class="restart-btn" type="button" id="restart-btn" aria-label="Ricomincia" style="display: none;">↺</button>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
