<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Famiglia in Avventura</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c0d18;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
      }
      .editor-link {
        position: fixed;
        top: 134px;
        right: 16px;
        bottom: auto;
        z-index: 10;
        padding: 8px 12px;
        border-radius: 12px;
        border: 1px solid rgba(141, 165, 190, 0.35);
        background: rgba(0, 14, 31, 0.46);
        color: #f4f6ff;
        text-decoration: none;
        font: 700 12px/1 monospace;
        opacity: 0.72;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        width: min(100vw, calc(100vh * 1080 / 1440));
        height: min(100vh, calc(100vw * 1440 / 1080));
        max-width: 1080px;
        max-height: 1440px;
        border: 2px solid #1f2848;
        box-shadow: 0 0 0 4px #0b1028;
      }
      #touch-controls {
        display: none;
        position: fixed;
        left: 16px;
        bottom: 16px;
        grid-template-columns: repeat(3, 96px);
        grid-template-rows: 96px;
        gap: 10px;
        padding: 12px;
        border: 1px solid rgba(141, 165, 190, 0.3);
        border-radius: 20px;
        background: rgba(0, 14, 31, 0.55);
        backdrop-filter: blur(6px);
        touch-action: none;
        user-select: none;
      }
      @media (pointer: coarse) {
        #touch-controls {
          display: grid;
        }
      }
      #touch-controls button {
        border: 1px solid #6c7b99;
        border-radius: 16px;
        background: linear-gradient(180deg, #1b3f6d, #102846);
        color: #f4f6ff;
        font: 700 34px/1 monospace;
        box-shadow: 0 4px 0 #08101f;
        touch-action: none;
        user-select: none;
      }
      #touch-controls button:active,
      #touch-controls button.active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #08101f;
        background: linear-gradient(180deg, #2b6eab, #17365f);
      }
      #touch-controls .left {
        grid-column: 1;
      }
      #touch-controls .right {
        grid-column: 2;
      }
      #touch-controls .jump {
        grid-column: 3;
      }
    </style>
  </head>
  <body>
    <a class="editor-link" href="./terrain-editor.html">Editor terreno</a>
    <canvas id="game" width="1080" height="1440" aria-label="Family side-scroller game"></canvas>
    <div id="touch-controls" aria-label="Touch controls">
      <button class="left" type="button" data-control="left" aria-label="Muovi a sinistra">◀</button>
      <button class="right" type="button" data-control="right" aria-label="Muovi a destra">▶</button>
      <button class="jump" type="button" data-control="jump" aria-label="Salta">▲</button>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
