<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Editor - Famiglia in Avventura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e0a1f;
        --panel: rgba(36, 26, 58, 0.92);
        --line: #4a3a78;
        --accent: #ffd23f;
        --good: #67d96b;
        --bad: #ff5b78;
        --text: #fff4d6;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(1200px 600px at 50% -10%, #2a2150 0%, #160f2c 55%, #0e0a1f 100%);
        color: var(--text);
        font-family: "Baloo 2", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: .05;
        z-index: 0;
        background-image: radial-gradient(circle, #fff 1px, transparent 1.4px);
        background-size: 26px 26px;
      }
      body { padding: 20px; position: relative; z-index: 1; }
      .shell {
        max-width: 1560px;
        margin: 0 auto;
        display: grid;
        gap: 16px;
        position: relative;
        z-index: 1;
      }
      /* ── Top bar ─────────────────────────────────────── */
      .topbar {
        display: grid;
        gap: 12px;
        padding: 18px 20px;
        border: 2px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        box-shadow: 0 0 0 4px #1a1030, 0 12px 30px rgba(0,0,0,.45);
      }
      .topbar-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      .topbar h1 {
        margin: 0;
        font-family: "Press Start 2P", monospace;
        font-size: 16px;
        letter-spacing: 0.06em;
        color: var(--accent);
        text-shadow: 0 3px 0 #b97600, 0 4px 0 rgba(0,0,0,.4);
      }
      .main-tabs { display: flex; gap: 8px; }
      .main-tab {
        font: 700 11px/1 "Press Start 2P", monospace;
        padding: 10px 16px;
        border-radius: 12px;
        border: 2px solid #51407f;
        background: linear-gradient(#3a2c63, #271c45);
        color: var(--text);
        cursor: pointer;
        box-shadow: 0 4px 0 #181030;
        letter-spacing: .5px;
        transition: transform .06s, box-shadow .06s;
      }
      .main-tab:active { transform: translateY(4px); box-shadow: 0 0 0 #181030; }
      .main-tab.active {
        background: linear-gradient(#ffd54a, #ffb028);
        color: #3a2300;
        border-color: transparent;
        box-shadow: 0 4px 0 #b56b00;
      }
      .main-tab.active:active { box-shadow: 0 0 0 #b56b00; }
      .topbar p { margin: 0; color: #c9bff0; line-height: 1.5; font-size: 14px; font-weight: 600; }
      /* ── Shared button styles ────────────────────────── */
      button, .file {
        border: 2px solid #51407f;
        border-radius: 12px;
        background: linear-gradient(#3a2c63, #271c45);
        color: var(--text);
        font: 700 13px/1 "Press Start 2P", monospace;
        padding: 11px 16px;
        cursor: pointer;
        box-shadow: 0 4px 0 #181030;
        transition: transform .06s, box-shadow .06s;
        letter-spacing: .5px;
      }
      button:active, .file:active { transform: translateY(4px); box-shadow: 0 0 0 #181030; }
      button.active {
        border-color: var(--accent);
        background: linear-gradient(#4a3a78, #352a5c);
        box-shadow: 0 4px 0 #181030, inset 0 0 0 1px rgba(255,210,63,.35);
      }
      button.primary {
        background: linear-gradient(#ffd54a, #ffb028);
        color: #3a2300; border: none; box-shadow: 0 5px 0 #b56b00;
      }
      button.primary:active { box-shadow: 0 1px 0 #b56b00; }
      button.danger {
        background: linear-gradient(#ff5b78, #c0274a);
        color: #fff4d6; border-color: #ff5b78; box-shadow: 0 4px 0 #7a0f2a;
      }
      button.danger:active { box-shadow: 0 0 0 #7a0f2a; }
      .status { color: #8fd0ff; font-weight: 700; font-size: 13px; }
      /* ── Panel visibility ────────────────────────────── */
      .panel-hidden { display: none !important; }
      /* ── Terrain controls ───────────────────────────── */
      .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      .sections { display: grid; gap: 18px; }
      .section {
        padding: 14px; border-radius: 18px;
        border: 2px solid var(--line);
        background: rgba(20, 12, 42, 0.8);
        box-shadow: 0 0 0 3px #110928;
      }
      .section-head {
        display: flex; justify-content: space-between;
        gap: 12px; align-items: baseline; margin-bottom: 10px;
      }
      .section-head h2 {
        margin: 0; font-family: "Press Start 2P", monospace;
        font-size: 14px; color: var(--accent);
        text-shadow: 0 2px 0 #b97600; letter-spacing: .5px;
      }
      .section-head small { color: #9b8fcc; }
      canvas {
        display: block; width: 100%; height: auto; border-radius: 12px;
        border: 2px solid var(--line); background: #0b0818;
        touch-action: none; image-rendering: pixelated;
        box-shadow: inset 0 0 20px rgba(0,0,0,.4);
      }
      .legend {
        display: grid; gap: 8px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        color: #c9bff0; font-size: 13px; font-weight: 600;
      }
      .level-tabs { display: flex; flex-wrap: wrap; gap: 10px; }
      .level-tabs button { min-width: 120px; }
      .level-tabs button.active {
        background: linear-gradient(#ffd54a, #ffb028);
        color: #3a2300; border: none; box-shadow: 0 4px 0 #b56b00;
      }
      .level-tabs button.active:active { box-shadow: 0 0 0 #b56b00; }
      .legend span { display: inline-flex; align-items: center; gap: 8px; }
      .swatch { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
      /* ── Sprite panel ────────────────────────────────── */
      .sp-shell {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 16px;
        align-items: start;
      }
      @media (max-width: 860px) { .sp-shell { grid-template-columns: 1fr; } }
      .sp-gallery {
        display: flex; flex-direction: column; gap: 10px;
        padding: 14px; border-radius: 18px;
        border: 2px solid var(--line);
        background: rgba(20, 12, 42, 0.8);
        box-shadow: 0 0 0 3px #110928;
      }
      .sp-cat-tabs, .sp-entity-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
      .sp-cat-tab {
        font: 700 10px/1 "Press Start 2P", monospace;
        padding: 8px 12px; border-radius: 10px;
        border: 2px solid #51407f;
        background: linear-gradient(#3a2c63, #271c45);
        color: var(--text); cursor: pointer; box-shadow: 0 3px 0 #181030;
        transition: transform .06s, box-shadow .06s;
      }
      .sp-cat-tab:active { transform: translateY(3px); box-shadow: 0 0 0 #181030; }
      .sp-cat-tab.active {
        background: linear-gradient(#ffd54a, #ffb028);
        color: #3a2300; border-color: transparent; box-shadow: 0 3px 0 #b56b00;
      }
      .sp-entity-tab {
        font: 700 9px/1 "Press Start 2P", monospace;
        padding: 6px 10px; border-radius: 8px;
        border: 2px solid #51407f;
        background: linear-gradient(#3a2c63, #271c45);
        color: var(--text); cursor: pointer; box-shadow: 0 2px 0 #181030;
        transition: transform .06s, box-shadow .06s;
      }
      .sp-entity-tab:active { transform: translateY(2px); box-shadow: 0 0 0 #181030; }
      .sp-entity-tab.active {
        border-color: var(--accent);
        background: linear-gradient(#4a3a78, #352a5c);
        box-shadow: 0 2px 0 #181030, inset 0 0 0 1px rgba(255,210,63,.35);
      }
      .sp-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
        gap: 6px; overflow-y: auto; max-height: 480px; padding: 2px;
      }
      .sp-card {
        display: flex; flex-direction: column; align-items: center;
        gap: 4px; padding: 6px; border: 2px solid #51407f;
        border-radius: 10px; background: rgba(10, 6, 22, 0.7);
        cursor: pointer; transition: border-color .12s, box-shadow .12s;
      }
      .sp-card:hover { border-color: #8fd0ff; }
      .sp-card.selected { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255,210,63,.25); }
      .sp-card.overridden { border-color: var(--good); }
      .sp-card.overridden.selected { border-color: var(--gold); }
      .sp-card-img {
        width: 64px; height: 64px;
        image-rendering: pixelated;
        border-radius: 4px;
        background: repeating-conic-gradient(#2a2040 0% 25%, #1a1430 0% 50%) 0 0 / 8px 8px;
        display: block; object-fit: contain;
      }
      .sp-card-label {
        font: 600 8px/1.3 "Press Start 2P", monospace;
        color: #9b8fcc; text-align: center;
        word-break: break-all; max-width: 64px;
      }
      .sp-card.overridden .sp-card-label { color: var(--good); }
      /* ── Pixel editor ────────────────────────────────── */
      .sp-editor {
        padding: 16px; border-radius: 18px;
        border: 2px solid var(--line);
        background: rgba(20, 12, 42, 0.8);
        box-shadow: 0 0 0 3px #110928;
        min-height: 400px;
        display: flex; flex-direction: column;
      }
      .sp-editor-empty {
        flex: 1; display: flex; align-items: center; justify-content: center;
        color: #4a3a78; text-align: center;
        font: 700 11px/1.8 "Press Start 2P", monospace;
        padding: 24px;
      }
      .sp-editor-active { display: flex; flex-direction: column; gap: 12px; flex: 1; }
      .pe-header {
        display: flex; justify-content: space-between; align-items: center; gap: 10px;
        flex-wrap: wrap;
      }
      .pe-title { font: 700 11px/1 "Press Start 2P", monospace; color: var(--gold); }
      .pe-header-btns { display: flex; gap: 6px; }
      .pe-header-btns button { font-size: 10px; padding: 7px 11px; box-shadow: 0 2px 0 #181030; }
      .pe-header-btns button:active { box-shadow: 0 0 0 #181030; }
      .pe-body { display: flex; gap: 12px; flex: 1; }
      .pe-sidebar {
        display: flex; flex-direction: column; gap: 8px;
        width: 52px; flex-shrink: 0;
      }
      .pe-tools { display: flex; flex-direction: column; gap: 4px; }
      .pe-tool {
        width: 44px; height: 38px; padding: 0; font-size: 15px;
        border-radius: 8px; border: 2px solid #51407f;
        background: linear-gradient(#3a2c63, #271c45);
        color: var(--text); cursor: pointer; box-shadow: 0 3px 0 #181030;
        display: grid; place-items: center;
        transition: transform .06s, box-shadow .06s;
      }
      .pe-tool:active { transform: translateY(3px); box-shadow: 0 0 0 #181030; }
      .pe-tool.active {
        border-color: var(--gold);
        background: linear-gradient(#4a3a78, #352a5c);
        box-shadow: 0 3px 0 #181030, inset 0 0 0 1px rgba(255,210,63,.3);
      }
      .pe-color-area { display: flex; flex-direction: column; gap: 4px; }
      .pe-cur-color {
        width: 44px; height: 26px; border-radius: 6px;
        border: 2px solid #51407f; background: #fff;
        cursor: pointer;
      }
      #pe-color-input {
        width: 44px; height: 22px; padding: 0; border: none;
        border-radius: 4px; cursor: pointer; background: none;
      }
      .pe-palette {
        display: grid; grid-template-columns: repeat(2, 22px);
        gap: 2px;
      }
      .pe-swatch {
        width: 22px; height: 22px; border-radius: 3px;
        cursor: pointer; border: 2px solid transparent;
        transition: border-color .1s;
      }
      .pe-swatch:hover { border-color: rgba(255,255,255,.5); }
      .pe-swatch.selected { border-color: var(--gold); }
      .pe-canvas-wrap {
        flex: 1; overflow: auto; border-radius: 8px;
        border: 2px solid var(--line); background: #111;
        min-height: 200px;
      }
      #pe-canvas {
        image-rendering: pixelated; display: block;
        cursor: crosshair; touch-action: none;
      }
      .pe-info { font-size: 11px; color: #6a5a9a; font-weight: 600; }
      .pe-actions { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 2px; }
      .pe-upload-label {
        border: 2px solid #51407f; border-radius: 12px;
        background: linear-gradient(#3a2c63, #271c45);
        color: var(--text);
        font: 700 13px/1 "Press Start 2P", monospace;
        padding: 11px 16px; cursor: pointer;
        box-shadow: 0 4px 0 #181030; letter-spacing: .5px;
        transition: transform .06s, box-shadow .06s;
      }
      .pe-upload-label:active { transform: translateY(4px); box-shadow: 0 0 0 #181030; }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="topbar">
        <div class="topbar-head">
          <h1>Game Editor</h1>
          <div class="main-tabs">
            <button class="main-tab active" id="tab-terrain">Terreno</button>
            <button class="main-tab" id="tab-sprites">Sprite &amp; Sfondi</button>
          </div>
        </div>
        <p id="topbar-desc">Terreno: disegna la linea verde. Buco: trascina per aprire un vuoto. Ripara buco: trascina sopra il vuoto per richiuderlo. Salva in localStorage oppure esporta il JSON che il gioco legge automaticamente.</p>

        <!-- Terrain-only controls -->
        <div id="terrain-controls">
          <div class="level-tabs">
            <button id="level-0" class="active" type="button">Livello 1</button>
            <button id="level-1" type="button">Livello 2</button>
          </div>
          <div class="controls" style="margin-top:10px">
            <button id="mode-terrain" class="active" type="button">Terreno</button>
            <button id="mode-gap" type="button">Vuoto</button>
            <button id="mode-erase" type="button">Ripara buco</button>
            <button id="save-local" class="primary" type="button">Salva nel gioco</button>
            <button id="download" type="button">Esporta JSON</button>
            <button id="copy" type="button">Copia JSON</button>
            <button id="reset" class="danger" type="button">Reset</button>
            <label class="file">
              Importa JSON
              <input id="import" type="file" accept="application/json" hidden />
            </label>
            <span id="status" class="status">Caricamento...</span>
          </div>
        </div>
      </div>

      <!-- ── Terrain panel ──────────────────────────────── -->
      <div id="panel-terrain">
        <div class="legend">
          <span><i class="swatch" style="background:#67d96b"></i>linea terreno</span>
          <span><i class="swatch" style="background:#ff5b78"></i>vuoto / buco</span>
          <span><i class="swatch" style="background:#ffd23f"></i>punti attivi</span>
        </div>
        <div class="sections" id="sections"></div>
      </div>

      <!-- ── Sprite & Backgrounds panel ─────────────────── -->
      <div id="panel-sprites" class="panel-hidden">
        <div class="sp-shell">

          <!-- Gallery (left) -->
          <div class="sp-gallery">
            <div class="sp-cat-tabs" id="sp-cat-tabs">
              <button class="sp-cat-tab active" data-cat="characters">Personaggi</button>
              <button class="sp-cat-tab" data-cat="enemies">Nemici</button>
              <button class="sp-cat-tab" data-cat="backgrounds">Sfondi</button>
            </div>
            <div class="sp-entity-tabs" id="sp-entity-tabs"></div>
            <div class="sp-grid" id="sp-grid"></div>
          </div>

          <!-- Pixel editor (right) -->
          <div class="sp-editor" id="sp-editor">
            <div class="sp-editor-empty" id="sp-editor-empty">
              ← Seleziona<br>uno sprite
            </div>
            <div class="sp-editor-active" id="sp-editor-active" style="display:none">
              <div class="pe-header">
                <span class="pe-title" id="pe-name"></span>
                <div class="pe-header-btns">
                  <button id="pe-undo" title="Annulla (Ctrl+Z)">↩</button>
                  <button id="pe-redo" title="Ripeti (Ctrl+Y)">↪</button>
                  <button class="danger" id="pe-reset">Reset</button>
                </div>
              </div>
              <div class="pe-body">
                <div class="pe-sidebar">
                  <div class="pe-tools">
                    <button class="pe-tool active" data-tool="pencil" title="Matita">✏</button>
                    <button class="pe-tool" data-tool="eraser" title="Gomma">☐</button>
                    <button class="pe-tool" data-tool="fill" title="Riempi">▣</button>
                    <button class="pe-tool" data-tool="eyedropper" title="Contagocce">◉</button>
                  </div>
                  <div class="pe-color-area">
                    <div class="pe-cur-color" id="pe-cur-color"></div>
                    <input type="color" id="pe-color-input" value="#ffffff" />
                  </div>
                  <div class="pe-palette" id="pe-palette"></div>
                </div>
                <div class="pe-canvas-wrap">
                  <canvas id="pe-canvas"></canvas>
                </div>
              </div>
              <div class="pe-info" id="pe-info"></div>
              <div class="pe-actions">
                <button class="primary" id="pe-save">Salva sprite</button>
                <label class="pe-upload-label">
                  Carica PNG
                  <input type="file" id="pe-upload-input" accept="image/png" hidden />
                </label>
                <button id="pe-download">Scarica PNG</button>
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
    <script src="./terrain-editor.js"></script>
  </body>
</html>
